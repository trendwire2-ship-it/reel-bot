name: Post reels

on:
  schedule:
    # ~45 min before 9 AM + 1 PM New York (EST/EDT) and 8 PM Ghana; the script checks the real local times
    - cron: "15 12,13,21,22 * * *"   # ~8:15 AM and ~5:15 PM New York (summer + winter time)
  workflow_dispatch:
    inputs:
      force:
        description: "Post the next reel right now (ignore schedule)"
        type: boolean
        default: false
      dry_run:
        description: "Render only, don't post (preview)"
        type: boolean
        default: false
      check_facebook:
        description: "Only check the Facebook connection (no render, no post)"
        type: boolean
        default: false
      covers_posted:
        description: "Add custom covers (thumbnails) to already-posted reels that don't have one"
        type: boolean
        default: false
      comment_posted:
        description: "Add the engagement comment to already-posted reels that don't have one"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages and voice-clone model
        if: ${{ !inputs.check_facebook && !inputs.comment_posted }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: deps-v3-${{ hashFiles('.github/workflows/post-reels.yml') }}

      - name: Install tools
        if: ${{ !inputs.check_facebook && !inputs.comment_posted }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 fonts-dejavu-core
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 soundfile pillow numpy edge-tts skia-python opencv-python-headless transformers
          # kokoro-onnx 0.4.9 reads voices-v1.0.bin; install it without letting it move chatterbox's numpy pin
          pip install -q --no-deps kokoro-onnx==0.4.9 && pip install -q onnxruntime espeakng-loader phonemizer-fork colorlog || echo 'kokoro optional'

      - name: Unlock your voice sample
        if: ${{ !inputs.check_facebook && !inputs.comment_posted }}
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -n "$VOICE_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice_ref.wav.enc -out assets/voice_ref.wav -pass env:VOICE_KEY
          else
            echo "No VOICE_KEY secret: using the Andrew voice"
          fi

      - name: Cache voice model
        if: ${{ !inputs.check_facebook && !inputs.comment_posted }}
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download voice model (first run only)
        if: ${{ !inputs.check_facebook && !inputs.comment_posted }}
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f models/voices.bin ] || curl -sSL -o models/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Render and post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CHECK_FB: ${{ inputs.check_facebook && '1' || '0' }}
          COMMENT_BACKFILL: ${{ inputs.comment_posted && '1' || '0' }}
          COVER_BACKFILL: ${{ inputs.covers_posted && '1' || '0' }}
          SLOTS: "America/New_York:9,America/New_York:18"
          COMIC_SLOT: "*"   # every reel is a painted motion comic; cinematic only as a fallback
          TZ_NAME: "America/New_York"
        run: python scripts/post.py

      - name: Remove unlocked voice sample
        if: always()
        run: rm -f assets/voice_ref.wav

      - name: Keep the video (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive the master file as proof of ownership (GitHub Release)
        if: ${{ !inputs.dry_run && !inputs.check_facebook && !inputs.comment_posted && !inputs.covers_posted }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.sha256 >/dev/null 2>&1 || exit 0   # only written when a reel was actually posted
          tag="masters-$(date -u +%Y-%m)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Original masters $(date -u +%B\ %Y)" --notes "Original Facts on Facts reels with SHA-256 fingerprints and upload timestamps. (c) Facts on Facts. All rights reserved."
          gh release upload "$tag" out/*.mp4 out/*.sha256 --clobber || echo "archive upload failed (posting unaffected)"

      - name: Save queue/posted changes
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A queue posted
          git diff --cached --quiet || (git commit -m "Posted reel" && git push)

      - name: Publish preview video to the 'previews' branch (dry runs only)
        if: ${{ inputs.dry_run }}
        run: |
          mkdir -p /tmp/pv && cp out/*.mp4 /tmp/pv/ 2>/dev/null || exit 0
          git checkout -q --orphan previews-tmp
          git rm -rfq . >/dev/null 2>&1 || true
          rm -rf assets scripts queue posted out models
          cp /tmp/pv/*.mp4 .
          git add *.mp4
          git commit -qm "Preview $(date -u +%Y-%m-%dT%H:%M)"
          git push -qf origin HEAD:previews
