name: Prepare motion comics (free)
on:
  schedule:
    - cron: "40 5 * * *"   # after the daily writer (04:23 Ghana/UTC), well before the 9 AM New York post
  workflow_dispatch:
    inputs:
      only:
        description: "Only prepare queue files whose name contains this (blank = all)"
        default: ""
permissions:
  contents: write
concurrency:
  group: prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle six pillow
      - name: Paint panels (Cloudflare) and animate them (Kaggle GPU)
        env:
          GH_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/prepare.py "${{ inputs.only }}"
      - name: Save prepared stories
        if: always()
        run: |
          git config user.name reel-bot; git config user.email reel-bot@users.noreply.github.com
          git add queue/*.json
          git diff --cached --quiet && exit 0
          git commit -qm "Prepare motion comics (panels + clips)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
