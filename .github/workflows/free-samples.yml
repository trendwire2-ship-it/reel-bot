name: Free comic + voice samples
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story JSON with a free 'comic' section (shot prompts)"
        default: "queue/2026-11-23-1-gardner-museum-heist.json"
      voices:
        description: "Also render the narrator voice auditions"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: deps-comic-v1
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 soundfile pillow numpy edge-tts skia-python opencv-python-headless "transformers>=4.45"
          # kokoro-onnx 0.4.9 reads voices-v1.0.bin; install it without letting it move chatterbox's numpy pin
          pip install -q --no-deps kokoro-onnx==0.4.9 && pip install -q onnxruntime espeakng-loader phonemizer-fork colorlog || echo 'kokoro optional'
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f models/voices.bin ] || curl -sSL -o models/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Unlock voice
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice_ref.wav.enc -out assets/voice_ref.wav -pass env:VOICE_KEY
      - name: Voice auditions
        if: ${{ inputs.voices }}
        run: python scripts/voice_samples.py
      - name: Free painted comic
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VOICE_MODE: kokoro
          KOKORO_VOICE: bm_fable
        run: |
          mkdir -p out
          COMIC_VARIANT=comic python scripts/comic.py "${{ inputs.story }}" out/free-comic.mp4
          python - <<'PY'
          import glob, subprocess
          from PIL import Image
          fs = sorted(glob.glob("out/cache/sheet-*.jpg") + glob.glob("out/cache/paint-*.jpg"), key=lambda f: __import__("os").path.getmtime(f))[:16]
          sheet = Image.new("RGB", (4 * 270, 4 * 480))
          for i, f in enumerate(fs):
              sheet.paste(Image.open(f).convert("RGB").resize((270, 480)), ((i % 4) * 270, (i // 4) * 480))
          sheet.save("out/panels.jpg", quality=88)
          PY
      - name: Clean up voice
        if: always()
        run: rm -f assets/voice_ref.wav
      - name: Publish to previews-free branch
        if: always()
        run: |
          mkdir -p /tmp/pv && cp out/free-comic.mp4 out/panels.jpg /tmp/pv/ 2>/dev/null || true
          cp out/voices/*.mp3 /tmp/pv/ 2>/dev/null || true
          git config user.name reel-bot; git config user.email reel-bot@users.noreply.github.com
          git checkout -q --orphan previews-free
          git rm -rfq . >/dev/null 2>&1 || true
          rm -rf assets scripts queue posted out models comic
          cp /tmp/pv/* . && git add -A && git commit -qm "free samples" && git push -qf origin HEAD:previews-free
